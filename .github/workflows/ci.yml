name: CI

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]
  workflow_dispatch:

# Cancela o run de um commit superado: sem isso, um run antigo pode terminar
# depois de um novo e republicar o playtest com código velho.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: lint
            script: lint
          - name: typecheck
            script: typecheck
          - name: test
            script: test
          - name: build
            script: build
          # Guarda de precache: falha se algum arquivo do dist ficar fora do
          # Service Worker, nos dois alvos de base (`/` e `/fdp-online/`).
          - name: precache
            script: verifica:precache:builds
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.script }}

  # Publica o link de playtest. Depende do job `ci` inteiro (lint, typecheck,
  # test, build), para que nada reprovado vire o link público.
  build-pages:
    name: build-pages
    needs: ci
    if: github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-pages:
    name: deploy-pages
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
